# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings / SEO
# Everything in <head> (title, description, Open Graph, Twitter card, JSON-LD) is
# built from these keys and the `author` block by _includes/seo.html.
# `title`, `description`, `url` and `baseurl` must never be blank: on GitHub Pages,
# jekyll-github-metadata silently substitutes the repo name, the repo "About" text
# and a computed URL for blank values.
title                    : "Noah Frahm"
tagline                  : "PhD Student, Computer Science, UNC Chapel Hill"   # <title> suffix
description              : "Building more capable and adaptable embodied agents."  # sidebar blurb; fallback meta description
seo_description          : "Noah Frahm is a computer science PhD student in the SPIN Lab at UNC Chapel Hill, advised by Roni Sengupta, working on embodied AI agents and computer vision."
url                      : "https://noahfrahm.github.io"   # no trailing slash
baseurl                  : ""
repository               : "NoahFrahm/NoahFrahm.github.io"
locale                   : "en_US"
date_created             : "2026-03-24"   # first commit of this site (JSON-LD dateCreated); keep quoted

# google analytics (blank = no analytics code is emitted)
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# SEO Related (blank = verification tag not emitted)
google_site_verification :  # HTML-tag token from https://search.google.com/search-console/about
bing_site_verification   :  # token from https://www.bing.com/webmasters/about

# Site Author
author:
  name             : "Noah Frahm"
  first_name       : "Noah"
  last_name        : "Frahm"
  job_title        : "PhD Student"
  affiliation      : "University of North Carolina at Chapel Hill"
  affiliation_url  : "https://cs.unc.edu/"
  lab              : "Spatial & Physical Intelligence (SPIN) Lab"
  lab_url          : "https://www.cs.unc.edu/~ronisen/"
  knows_about      : ["Embodied AI", "Embodied question answering", "Vision-language models", "Computer vision", "3D reconstruction", "Next-best-view planning"]
  avatar           : "/images/headshot.jpg"   # root-relative; also used as og:image / twitter:image
  avatar_width     : 600
  avatar_height    : 616
  bio              : "PhD Student, Computer Science"
  location         : "Chapel Hill, NC"
  employer         : "UNC Chapel Hill"
  pubmed           : 
  googlescholar    : "https://scholar.google.com/citations?user=5Qvw2yUAAAAJ&hl=en"
  email            : "nofrahm@cs.unc.edu"
  researchgate     :  # e.g., "https://www.researchgate.net/profile/yourprofile"
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "NoahFrahm"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      : # e.g., "https://profiles.impactstory.org/u/xxxx-xxxx-xxxx-xxxx"
  lastfm           :
  linkedin         : "noah-frahm-4118161b2"
  dblp             : "https://dblp.org/pid/386/8990.html"
  orcid            : # e.g., "https://orcid.org/xxxx" (adds a sidebar link and a JSON-LD sameAs entry)
  pinterest        :
  soundcloud       :
  stackoverflow    : # http://stackoverflow.com/users/123456/username
  steam            :
  tumblr           :
  twitter          : # handle without @ (adds twitter:site/creator tags and a sameAs entry)
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - run_server.sh
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: America/New_York # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins (GitHub Pages only loads plugins on its whitelist; both of these are)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
